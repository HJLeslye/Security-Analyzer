<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Acceso - Security Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            display: flex; align-items: center; justify-content: center; 
            width: 100vw; height: 100vh; background-color: #001f3f; 
            font-family: sans-serif; overflow: hidden;
        }
        .full-login { display: flex; width: 100vw; height: 100vh; }
        
        .side-visual { 
            flex: 1; 
            background: linear-gradient(135deg, #ff4b2b, #ff416c); 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 40px; 
            text-align: center; 
        }
        
        .side-form { 
            flex: 1; 
            background: #001f3f; 
            color: white; 
            padding: 60px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }
        
        .form-container { width: 100%; max-width: 380px; }
        
        .ui-inputfield { 
            width: 100% !important; 
            background: transparent !important; 
            border: none !important; 
            border-bottom: 2px solid #555 !important; 
            color: white !important; 
            padding: 12px 5px !important; 
            margin-bottom: 20px !important; 
            font-size: 0.9rem !important;
        }
        
        .ui-inputfield:focus { border-bottom-color: #ff4b2b !important; }

        .btn-ingresar { 
            background: #ff4b2b !important; 
            border: none !important; 
            width: 100% !important; 
            border-radius: 25px !important; 
            padding: 12px !important; 
            font-weight: bold !important; 
            font-size: 1rem !important; 
            margin-top: 10px !important;
        }
    </style>
</h:head>
<h:body>
    <div class="full-login">
        <div class="side-visual">
            <h1 style="font-size: 2.2rem; letter-spacing: 1px;">Security Data Analyzer</h1>
            <p style="margin-top: 15px; font-size: 1.1rem; opacity: 0.85; max-width: 80%;">
                Monitoreo inteligente de infraestructura y gestión de riesgos críticos.
            </p>
        </div>

        <div class="side-form">
            <h:form styleClass="form-container">
                <p:growl id="msg" showDetail="true" />
                <h1 style="color: #ff4b2b; margin-bottom: 35px; font-size: 1.8rem; text-align: center; font-weight: bold;">
                    INICIAR SESIÓN
                </h1>
                
                <p:inputText value="#{loginController.username}" placeholder="NOMBRE DE USUARIO" required="true" />
                <p:password value="#{loginController.password}" placeholder="CONTRASEÑA" required="true" />
                
                <p:commandButton value="INGRESAR" action="#{loginController.login}" update="msg" styleClass="btn-ingresar" />
            </h:form>
        </div>
    </div>
</h:body>
</html>
